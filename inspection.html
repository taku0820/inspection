<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>設備点検記録</title>
<style>
/* ── CSS変数（ダークモード） ── */
:root {
  --bg:        #0a0a0f;
  --bg2:       #111827;
  --bg3:       #1e293b;
  --bg4:       #0f172a;
  --border:    #334155;
  --border2:   #1e293b;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #64748b;
  --blue:      #60a5fa;
  --blue2:     #93c5fd;
  --header-bg: linear-gradient(135deg,#111827 0%,#1e1b4b 100%);
  --card-shadow: 0 4px 24px #0006;
  --input-bg:  #1e293b;
  --prev-bg:   #1a1a2e;
  --prev-border:#6366f1;
  --prev-label:#818cf8;
  --prev-text: #c7d2fe;
  --replace-bg:#0c1a2e;
  --note-bg:   #0f172a;
  --note-color:#94a3b8;
  --preset-bg: #1e293b;
  --history-bg:#1e293b;
}
/* ── ライトモード変数 ── */
body.light {
  --bg:        #f1f5f9;
  --bg2:       #ffffff;
  --bg3:       #e2e8f0;
  --bg4:       #f8fafc;
  --border:    #cbd5e1;
  --border2:   #e2e8f0;
  --text:      #1e293b;
  --text2:     #475569;
  --text3:     #94a3b8;
  --blue:      #2563eb;
  --blue2:     #1d4ed8;
  --header-bg: linear-gradient(135deg,#1e40af 0%,#4338ca 100%);
  --card-shadow: 0 2px 12px #0001;
  --input-bg:  #ffffff;
  --prev-bg:   #ede9fe;
  --prev-border:#6366f1;
  --prev-label:#4f46e5;
  --prev-text: #3730a3;
  --replace-bg:#eff6ff;
  --note-bg:   #f8fafc;
  --note-color:#475569;
  --preset-bg: #f1f5f9;
  --history-bg:#f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
  min-height: 100vh; padding-bottom: 60px;
  transition: background .3s, color .3s;
}
/* Toast */
#toast {
  display: none; position: fixed; top: 20px; right: 20px; z-index: 9999;
  padding: 14px 24px; border-radius: 10px; border: 1px solid;
  font-weight: 700; font-size: 16px; box-shadow: 0 4px 20px #0008;
}
/* Header */
header {
  background: var(--header-bg);
  border-bottom: 2px solid var(--border);
  padding: 16px 20px; position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
}
.app-title { font-size: 22px; font-weight: 900; color: var(--blue2); letter-spacing: 1px; }
.app-sub { font-size: 12px; color: var(--text3); letter-spacing: 2px; margin-top: 2px; }
.operator-box { display: flex; align-items: center; gap: 10px; }
label.lbl { color: var(--text2); font-size: 13px; font-weight: 600; }
select, input[type=text], input[type=number], textarea {
  background: var(--input-bg); color: var(--text);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 10px 16px; font-size: 16px; font-family: inherit; outline: none;
}
select { min-width: 130px; cursor: pointer; }
/* Main */
main { max-width: 900px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
.card {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 14px; padding: 20px; box-shadow: var(--card-shadow);
}
.section-title {
  font-size: 17px; font-weight: 800; color: var(--blue);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
/* Search */
#search-input {
  width: 100%; border-radius: 10px; padding: 14px 18px;
  font-size: 16px; margin-bottom: 16px;
}
/* Equip grid */
.equip-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
}
.equip-btn {
  background: var(--bg3); border: 2px solid var(--border); border-radius: 10px;
  padding: 14px 12px; color: var(--text); cursor: pointer; text-align: left;
  transition: all .2s;
}
.equip-btn.active { background: #1e3a5f; border-color: #3b82f6; box-shadow: 0 0 12px #3b82f644; }
.equip-id { font-size: 11px; color: var(--blue); font-weight: 700; letter-spacing: 1px; }
.equip-name { font-size: 15px; font-weight: 800; margin-top: 4px; color: var(--text); }
.equip-count { font-size: 11px; color: var(--text3); margin-top: 4px; }
/* Prev memo */
.prev-memo-box {
  background: var(--prev-bg); border: 1px solid var(--prev-border);
  border-radius: 8px; padding: 12px; margin-bottom: 16px;
}
.prev-memo-label { font-size: 12px; color: var(--prev-label); font-weight: 700; margin-bottom: 4px; }
.prev-memo-text { font-size: 14px; color: var(--prev-text); }
/* All OK btn */
.all-ok-btn {
  width: 100%; background: #052e16; color: #22c55e;
  border: 2px solid #16a34a; border-radius: 10px;
  padding: 16px; font-size: 16px; font-weight: 800;
  cursor: pointer; margin-bottom: 16px; letter-spacing: 1px;
}
/* Item rows */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-row {
  background: var(--bg3); border: 2px solid var(--border);
  border-radius: 10px; padding: 14px; transition: all .3s;
}
.item-row.error { border-color: #ef4444; background: #2d0a0a; }
.item-name {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.error-dot { color: #ef4444; font-size: 10px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.status-btn {
  background: var(--bg4); color: var(--text3);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 10px 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  min-width: 60px; gap: 2px; transition: all .2s; font-weight: 700;
  font-size: 14px;
}
.status-btn .icon { font-size: 18px; }
/* Replace form */
.replace-form {
  margin-top: 12px; background: var(--replace-bg);
  border: 1px solid var(--blue); border-radius: 8px; padding: 12px;
  display: none;
}
.replace-form.show { display: block; }
.replace-title { font-size: 13px; color: #60a5fa; font-weight: 700; margin-bottom: 10px; }
/* 複数部品エントリ */
.part-entry {
  background: var(--bg4); border: 1px solid var(--blue);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  position: relative;
}
.part-entry-num { font-size: 11px; color: #60a5fa; font-weight: 700; margin-bottom: 8px; }
.part-remove-btn {
  position: absolute; top: 8px; right: 8px;
  background: #2d0a0a; color: #f87171; border: 1px solid #dc2626;
  border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer;
}
.add-part-btn {
  width: 100%; margin-top: 4px; background: #0c1a2e; color: #60a5fa;
  border: 1px dashed #2563eb; border-radius: 8px;
  padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
}
.replace-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.replace-grid > div { display: flex; flex-direction: column; gap: 4px; }
.small-label { font-size: 12px; color: var(--text2); }
.small-input { padding: 10px 12px; font-size: 14px; border-radius: 6px; width: 160px; }
.small-input.qty { width: 80px; }
/* Error banner */
.error-banner {
  background: #2d0a0a; border: 1px solid #ef4444;
  border-radius: 8px; padding: 12px; color: #f87171;
  font-size: 14px; font-weight: 700; margin-top: 12px; display: none;
}
/* Presets */
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.preset-btn {
  background: var(--preset-bg); color: var(--text2);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 8px 14px; font-size: 13px; cursor: pointer;
}
textarea#memo { width: 100%; border-radius: 10px; padding: 12px 16px; resize: vertical; }
/* Submit */
.submit-btn {
  width: 100%; margin-top: 20px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  color: #fff; border: none; border-radius: 12px;
  padding: 20px; font-size: 18px; font-weight: 900;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 20px #3b82f644; transition: all .3s;
}
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
/* History */
.history-list { display: flex; flex-direction: column; gap: 12px; }
.history-card {
  background: var(--history-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
}
.history-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.history-equip { font-size: 16px; font-weight: 800; }
.history-id { font-size: 11px; color: #60a5fa; background: #1e3a5f; padding: 2px 6px; border-radius: 4px; }
.history-op { font-size: 13px; color: var(--text2); margin-left: auto; }
.history-time { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
.history-statuses { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.h-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid; font-weight: 600; }
.history-memo { font-size: 12px; color: #818cf8; margin-top: 4px; }
/* ID badge */
.equip-id-badge {
  background: #1e3a5f; color: #60a5fa; border: 1px solid #3b82f6;
  border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 600;
}
/* 項目備考欄 */
.item-note {
  margin-top: 10px;
  border-top: 1px dashed #334155;
  padding-top: 8px;
}
.item-note textarea {
  width: 100%; border-radius: 6px; padding: 8px 12px;
  font-size: 14px; resize: none; min-height: 52px;
  border: 1px solid var(--border); background: var(--note-bg); color: var(--note-color);
  transition: border-color .2s, color .2s;
  font-family: inherit;
}
.item-note textarea:focus {
  border-color: #60a5fa; color: #e2e8f0; outline: none;
}
.item-note-label {
  font-size: 11px; color: var(--text2); margin-bottom: 5px; display: block;
  letter-spacing: 0.5px;
}

/* ── テーマ切替ボタン ── */
.theme-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px; padding: 6px 14px; color: #fff;
  font-size: 13px; cursor: pointer; font-weight: 700;
  transition: all .2s;
}
body.light .theme-btn { border-color: rgba(0,0,0,0.2); color: #1e293b; }
/* ── 履歴モーダル ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7); align-items: flex-start; justify-content: center;
  padding: 20px 12px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border-radius: 16px;
  width: 100%; max-width: 720px;
  box-shadow: 0 8px 40px #0008;
  margin: auto;
}
.modal-header {
  background: var(--header-bg); border-radius: 16px 16px 0 0;
  padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 17px; font-weight: 900; color: #fff; }
.modal-close {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  border-radius: 8px; padding: 6px 14px; font-size: 16px; cursor: pointer; font-weight: 700;
}
.modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
.modal-equip-select {
  width: 100%; margin-bottom: 16px; border-radius: 10px; font-size: 16px;
  background: var(--input-bg); color: var(--text); border: 2px solid var(--border);
  padding: 12px 16px;
}
.mhist-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 12px;
}
.mhist-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.mhist-time { font-size: 13px; color: var(--text3); }
.mhist-op { font-size: 13px; color: var(--text2); margin-left: auto; }
.mhist-items { display: flex; flex-direction: column; gap: 6px; }
.mhist-item { display: flex; gap: 8px; font-size: 14px; flex-wrap: wrap; align-items: flex-start; }
.mhist-item-name { color: var(--text2); min-width: 160px; }
.mhist-badge {
  font-size: 12px; padding: 2px 8px; border-radius: 4px;
  border: 1px solid; font-weight: 700; white-space: nowrap;
}
.mhist-note { font-size: 12px; color: var(--text3); font-style: italic; }
.mhist-parts { font-size: 12px; color: #60a5fa; margin-top: 2px; }
.mhist-memo { font-size: 13px; color: var(--prev-label); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.no-history { text-align: center; color: var(--text3); padding: 30px; }
/* 構成図モーダル */
.diag-modal { background: var(--bg2); border-radius:16px; width:100%; max-width:800px; margin:auto; box-shadow:0 8px 40px #0008; }
.diag-modal-header { background: var(--header-bg); border-radius:16px 16px 0 0; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
.diag-tabs { display:flex; gap:8px; flex-wrap:wrap; padding:14px 16px 0; border-bottom:1px solid var(--border); }
.diag-tab { background:transparent; border:none; border-bottom:3px solid transparent; padding:8px 14px; font-size:14px; font-weight:700; color:var(--text2); cursor:pointer; }
.diag-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.diag-body { padding:16px; max-height:75vh; overflow-y:auto; text-align:center; }
.diag-body img { max-width:100%; border-radius:8px; cursor:zoom-in; transition:transform .2s; }
.diag-body img.zoomed { cursor:zoom-out; transform:scale(1.0); }
.diag-loading { color:var(--text3); padding:40px; }
/* 設備ボタンに構成図ボタン追加 */
.equip-diag-btn {
  display:block; width:100%; margin-top:4px;
  background:transparent; border:1px solid var(--border);
  border-radius:6px; padding:4px; font-size:11px;
  color:#a78bfa; cursor:pointer; font-weight:700;
}
/* 点検項目メンテナンス図ボタン */
.manual-btn {
  display:inline-flex; align-items:center; gap:4px;
  margin-top:8px; background:transparent;
  border:1px solid #7c3aed; border-radius:6px;
  padding:5px 10px; font-size:12px; font-weight:700;
  color:#a78bfa; cursor:pointer; transition:all .2s;
}
.manual-btn:hover { background:#1e1040; }
body.light .manual-btn { border-color:#7c3aed; color:#6d28d9; }
/* メンテナンス図モーダル */
.manual-modal { background:var(--bg2); border-radius:16px; width:100%; max-width:860px; margin:auto; box-shadow:0 8px 40px #0008; }
.manual-modal-header { background:var(--header-bg); border-radius:16px 16px 0 0; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.manual-modal-title { font-size:15px; font-weight:900; color:#fff; }
.manual-modal-body { padding:16px; max-height:78vh; overflow-y:auto; text-align:center; }
.manual-modal-body img { max-width:100%; border-radius:8px; cursor:zoom-in; }
.manual-modal-body img.zoomed { cursor:zoom-out; transform:scale(1.5); transform-origin:top center; }
.manual-modal-body iframe { width:100%; height:70vh; border:none; border-radius:8px; }
.manual-no-image { color:var(--text3); padding:30px; font-size:14px; }
.pdf-fallback { margin-top:12px; }
.pdf-fallback a { color:var(--blue); font-weight:700; font-size:14px; }
/* 設備ボタンに履歴ボタン追加 */
.equip-hist-btn {
  display: block; width: 100%; margin-top: 6px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px; font-size: 11px;
  color: var(--blue); cursor: pointer; font-weight: 700;
}
</style>
</head>
<body>

<div id="toast"></div>

<header>
  <div class="header-inner">
    <div>
      <div class="app-title">⚙ 設備点検記録</div>
      <div class="app-sub">Equipment Inspection System</div>
    </div>
    <div class="operator-box">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀ ライト</button>
      <label class="lbl">担当者</label>
      <select id="operator-select" onchange="onOperatorChange(this.value)">
        <option value="">-- 選択 --</option>
      </select>
    </div>
  </div>
</header>

<!-- メンテナンス図モーダル -->
<div class="modal-overlay" id="manual-modal">
  <div class="manual-modal">
    <div class="manual-modal-header">
      <div class="manual-modal-title" id="manual-modal-title">📋 メンテナンス図</div>
      <button class="modal-close" onclick="closeManualModal()">✕ 閉じる</button>
    </div>
    <div class="manual-modal-body" id="manual-modal-body"></div>
  </div>
</div>

<!-- 構成図モーダル -->
<div class="modal-overlay" id="diag-modal">
  <div class="diag-modal">
    <div class="diag-modal-header">
      <div class="modal-title" id="diag-modal-title">📋 構成図</div>
      <button class="modal-close" onclick="closeDiagModal()">✕ 閉じる</button>
    </div>
    <div class="diag-tabs" id="diag-tabs"></div>
    <div class="diag-body" id="diag-body">
      <div class="diag-loading">読み込み中...</div>
    </div>
  </div>
</div>

<!-- 履歴モーダル -->
<div class="modal-overlay" id="hist-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="hist-modal-title">📁 点検履歴</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="modal-close" style="background:rgba(239,68,68,0.3);border-color:rgba(239,68,68,0.5)" onclick="clearEquipHistory()">🗑 全削除</button>
        <button class="modal-close" onclick="closeHistModal()">✕ 閉じる</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="hist-modal-body"></div>
    </div>
  </div>
</div>

<main>
  <!-- 設備選択 -->
  <section class="card">
    <div class="section-title">🔍 設備を選択</div>
    <input type="text" id="search-input" placeholder="設備ID / 設備名で検索..." oninput="renderEquipGrid()">
    <div class="equip-grid" id="equip-grid"></div>
  </section>

  <!-- 点検フォーム -->
  <section class="card" id="inspection-form" style="display:none">
    <div class="section-title" id="form-title"></div>
    <div id="prev-memo-box" class="prev-memo-box" style="display:none">
      <div class="prev-memo-label">📌 前回の申し送り事項</div>
      <div class="prev-memo-text" id="prev-memo-text"></div>
    </div>
    <button class="all-ok-btn" onclick="setAllOk()">✓ 全項目を正常(OK)にする</button>
    <div class="item-list" id="item-list"></div>
    <div class="error-banner" id="error-banner"></div>
    <div style="margin-top:20px">
      <label class="lbl">📝 申し送り・メモ（次回担当者へ）</label>
      <div class="preset-row" id="preset-row"></div>
      <textarea id="memo" rows="3" placeholder="特記事項を入力..."></textarea>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">🚀 点検完了・送信</button>
  </section>

  <!-- 履歴 -->
  <section class="card" id="history-section" style="display:none">
    <div class="section-title">📁 直近の点検履歴</div>
    <div class="history-list" id="history-list"></div>
  </section>
</main>

<script>
// ============================================================
// CONFIG — ここを書き換えるだけでカスタマイズできます
// ============================================================
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbwsIz_kuYaE9Bgou0eRjlXy_L1T_rUZOKICNaggaK8ib44I2QfrzQqzInevVxThDkqSpQ/exec",
  operators: ["箱田", "白濵", "土生", "山田"],
  // items: { name:"項目名", unit:"単位" } の形式
  // unit は交換時に使う単位。交換しない項目は unit:"式" にしてください
  equipment: [
    { id: "CMP-001", name: "TP用 中圧 スクリューコンプレッサー(18.5kw)", diagrams: [
      { title:"構成図", url:"https://taku0820.github.io/inspection/CMP-001%EF%BC%88%E5%8C%97%E8%B6%8A18.5%EF%BD%8B%EF%BD%97%EF%BC%89/cmp001-1.pdf" },

const STATUS = {
  ok:      { label:"正常", color:"#22c55e", bg:"#052e16", border:"#16a34a", icon:"✓" },
  ng:      { label:"異常", color:"#ef4444", bg:"#2d0a0a", border:"#dc2626", icon:"✕" },
  replace: { label:"交換", color:"#3b82f6", bg:"#0c1a2e", border:"#2563eb", icon:"↺" },
  clean:   { label:"清掃", color:"#eab308", bg:"#1a1500", border:"#ca8a04", icon:"✦" },
};

const STORAGE_KEY  = "fis_operator";
const HISTORY_KEY  = "fis_history";

let currentEquip = null;
let checks = {};
let partDetails = {};
let history = [];

// ── 初期化 ──────────────────────────────
// ── テーマ切替 ──────────────────────────────
const THEME_KEY = "fis_theme";
function toggleTheme() {
  const isLight = document.body.classList.toggle("light");
  localStorage.setItem(THEME_KEY, isLight ? "light" : "dark");
  document.getElementById("theme-btn").textContent = isLight ? "🌙 ダーク" : "☀ ライト";
}
function applyTheme() {
  const theme = localStorage.getItem(THEME_KEY) || "dark";
  if (theme === "light") {
    document.body.classList.add("light");
    document.getElementById("theme-btn").textContent = "🌙 ダーク";
  }
}

// ── 設備別履歴モーダル ────────────────────────
function openHistModal(equipId) {
  const equip = CONFIG.equipment.find(e => e.id === equipId);
  if (!equip) return;
  const equipHistory = history.filter(h => h.equipId === equipId).slice().reverse();
  document.getElementById("hist-modal-title").textContent = "📁 " + equip.name + " — 点検履歴";

  const body = document.getElementById("hist-modal-body");
  if (equipHistory.length === 0) {
    body.innerHTML = '<div class="no-history">履歴がありません</div>';
  } else {
    body.innerHTML = equipHistory.map(h => {
      const itemRows = Object.entries(h.checks).map(([item, st]) => {
        const s = STATUS[st];
        const note = (h.itemNotes && h.itemNotes[item]) ? `<span class="mhist-note">📝 ${h.itemNotes[item]}</span>` : "";
        const parts = (h.partDetails && h.partDetails[item]) ? buildPartsText(h.partDetails[item]) : "";
        return `<div class="mhist-item">
          <span class="mhist-item-name">${item}</span>
          <span class="mhist-badge" style="color:${s.color};border-color:${s.border};background:${s.bg}">${s.icon} ${s.label}</span>
          ${note}
          ${parts ? `<span class="mhist-parts">🔧 ${parts}</span>` : ""}
        </div>`;
      }).join("");
      const memo = h.memo ? `<div class="mhist-memo">📌 ${h.memo}</div>` : "";
      const globalIdx = history.findIndex(r => r.timestamp === h.timestamp && r.equipId === h.equipId);
      return `<div class="mhist-card">
        <div class="mhist-header">
          <span class="mhist-time">🕐 ${h.timestamp}</span>
          <span class="mhist-op">👤 ${h.operator}</span>
          <button onclick="deleteOneHistory(${globalIdx},'${equipId}')"
            style="margin-left:auto;background:#2d0a0a;color:#f87171;border:1px solid #dc2626;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer">✕ 削除</button>
        </div>
        <div class="mhist-items">${itemRows}</div>
        ${memo}
      </div>`;
    }).join("");
  }
  document.getElementById("hist-modal").classList.add("open");
}

function buildPartsText(detail) {
  if (!detail) return "";
  const unit = detail.unit || "個";
  if (detail.entries && detail.entries.length > 0) {
    return detail.entries.filter(Boolean).map(e =>
      (e.partName || "") + (e.partNo ? "／" + e.partNo : "") + " ×" + (e.qty || 1) + unit
    ).join("、");
  }
  if (detail.partName || detail.partNo) {
    return (detail.partName || "") + (detail.partNo ? "／" + detail.partNo : "") + " ×" + (detail.qty || 1) + unit;
  }
  return "";
}

function closeHistModal() {
  document.getElementById("hist-modal").classList.remove("open");
}

// ── 構成図モーダル ───────────────────────────
let currentDiagEquipId = null;

function openDiagModal(equipId) {
  const equip = CONFIG.equipment.find(e => e.id === equipId);
  if (!equip || !equip.diagrams || equip.diagrams.length === 0) return;
  currentDiagEquipId = equipId;
  document.getElementById("diag-modal-title").textContent = "📋 " + equip.name + " — 構成図";

  // タブ生成
  const tabs = document.getElementById("diag-tabs");
  tabs.innerHTML = equip.diagrams.map((d, i) =>
    '<button class="diag-tab' + (i===0?' active':'') + '" onclick="switchDiagTab(' + i + ')">' + d.title + '</button>'
  ).join('');

  const d0 = equip.diagrams[0];
  showDiagContent(d0.url, d0.type || (d0.url.endsWith('.pdf') ? 'pdf' : 'image'));
  document.getElementById("diag-modal").classList.add("open");
}

function switchDiagTab(idx) {
  const equip = CONFIG.equipment.find(e => e.id === currentDiagEquipId);
  if (!equip) return;
  document.querySelectorAll(".diag-tab").forEach((t, i) => t.classList.toggle("active", i===idx));
  const d = equip.diagrams[idx];
  showDiagContent(d.url, d.type || (d.url.endsWith('.pdf') ? 'pdf' : 'image'));
}

function showDiagContent(url, type) {
  const body = document.getElementById("diag-body");
  if (type === 'pdf') {
    body.innerHTML =
      '<iframe src="' + url + '" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>' +
      '<div style="text-align:center;margin-top:8px"><a href="' + url + '" target="_blank" style="color:#60a5fa;font-size:13px">📄 別タブで開く</a></div>';
  } else {
    body.innerHTML = '<div class="diag-loading">📷 読み込み中...</div>';
    const img = new Image();
    img.onload = () => {
      body.innerHTML = '';
      img.className = '';
      img.onclick = () => img.classList.toggle("zoomed");
      img.style.maxWidth = "100%";
      body.appendChild(img);
    };
    img.onerror = () => {
      body.innerHTML = '<div class="diag-loading" style="color:#f87171">⚠ 画像を読み込めませんでした<br><small style="word-break:break-all">' + url + '</small></div>';
    };
    img.src = url;
  }
}

function showDiagImage(url) {
  showDiagContent(url, url.endsWith('.pdf') ? 'pdf' : 'image');
}

function closeDiagModal() {
  document.getElementById("diag-modal").classList.remove("open");
  currentDiagEquipId = null;
}

// 1件削除
function deleteOneHistory(idx, equipId) {
  if (!confirm("この履歴を削除しますか？\n※スプレッドシートのデータは削除されません")) return;
  history.splice(idx, 1);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
  renderEquipGrid();
  // モーダルを再描画
  const remaining = history.filter(h => h.equipId === equipId);
  if (remaining.length === 0) {
    closeHistModal();
  } else {
    openHistModal(equipId);
  }
}

// 設備の全履歴削除
function clearEquipHistory() {
  const title = document.getElementById("hist-modal-title").textContent;
  if (!confirm("この設備の履歴をすべて削除しますか？\n※スプレッドシートのデータは削除されません")) return;
  const equipId = history.find(h => title.includes(h.equipName))?.equipId;
  if (!equipId) {
    // フォールバック：モーダルで開いている設備IDを取得
    history = history.filter(h => !title.includes(h.equipName));
  } else {
    history = history.filter(h => h.equipId !== equipId);
  }
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
  renderEquipGrid();
  closeHistModal();
  showToast("履歴を削除しました", "success");
}
// ── メンテナンス図モーダル ──────────────────
function openManualModal(safeId) {
  if (!currentEquip) return;
  const itemObj = currentEquip.items.find(i =>
    i.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_") === safeId
  );
  if (!itemObj || !itemObj.manual) return;
  const m = itemObj.manual;
  document.getElementById("manual-modal-title").textContent = "📋 " + itemObj.name;
  const body = document.getElementById("manual-modal-body");
  body.innerHTML = '<div class="manual-no-image">📷 読み込み中...</div>';
  document.getElementById("manual-modal").classList.add("open");

  if (m.type === "image") {
    const img = new Image();
    img.onload = () => {
      body.innerHTML = "";
      img.style.maxWidth = "100%";
      img.onclick = () => img.classList.toggle("zoomed");
      body.appendChild(img);
    };
    img.onerror = () => {
      body.innerHTML = '<div class="manual-no-image">⚠ 画像を読み込めませんでした<br><small>' + m.url + '</small></div>';
    };
    img.src = m.url;
  } else if (m.type === "pdf") {
    // iframeで試みる（スマホはフォールバックリンクも表示）
    body.innerHTML =
      '<iframe src="' + m.url + '" title="' + itemObj.name + '"></iframe>' +
      '<div class="pdf-fallback">スマホでPDFが表示されない場合は → <a href="' + m.url + '" target="_blank">別タブで開く</a></div>';
  } else {
    body.innerHTML = '<div class="manual-no-image">⚠ 対応していない形式です</div>';
  }
}

function closeManualModal() {
  document.getElementById("manual-modal").classList.remove("open");
  document.getElementById("manual-modal-body").innerHTML = "";
}

// モーダル外クリックで閉じる
document.addEventListener("click", e => {
  if (e.target.id === "hist-modal") closeHistModal();
  if (e.target.id === "diag-modal") closeDiagModal();
  if (e.target.id === "manual-modal") closeManualModal();
});

window.onload = () => {
  applyTheme();
  // 担当者セレクト
  const sel = document.getElementById("operator-select");
  CONFIG.operators.forEach(o => {
    const opt = document.createElement("option");
    opt.value = opt.textContent = o;
    sel.appendChild(opt);
  });
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) sel.value = saved;

  // 定型コメント
  const pr = document.getElementById("preset-row");
  CONFIG.presetComments.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.textContent = c;
    btn.onclick = () => {
      const t = document.getElementById("memo");
      t.value = t.value ? t.value + "、" + c : c;
    };
    pr.appendChild(btn);
  });

  // 履歴読み込み
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch { history = []; }
  renderHistory();
  renderEquipGrid();
};

function onOperatorChange(v) {
  localStorage.setItem(STORAGE_KEY, v);
}

// ── 設備グリッド ──────────────────────────
function renderEquipGrid() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const grid = document.getElementById("equip-grid");
  grid.innerHTML = "";
  CONFIG.equipment
    .filter(e => e.id.toLowerCase().includes(q) || e.name.includes(q))
    .forEach(equip => {
      const btn = document.createElement("button");
      btn.className = "equip-btn" + (currentEquip?.id === equip.id ? " active" : "");
      const equipHistory = history.filter(h => h.equipId === equip.id);
      const histBtn = equipHistory.length > 0
        ? '<button class="equip-hist-btn" onclick="event.stopPropagation();openHistModal(\'' + equip.id + '\')">📁 履歴を見る</button>'
        : '';
      const diagBtn = (equip.diagrams && equip.diagrams.length > 0)
        ? '<button class="equip-diag-btn" onclick="event.stopPropagation();openDiagModal(\'' + equip.id + '\')">📋 構成図を見る</button>'
        : '';
      const histCount = equipHistory.length > 0 ? ' · 履歴' + equipHistory.length + '件' : '';
      btn.innerHTML = '<div class="equip-id">' + equip.id + '</div>'
        + '<div class="equip-name">' + equip.name + '</div>'
        + '<div class="equip-count">' + equip.items.length + '項目' + histCount + '</div>'
        + diagBtn + histBtn;
      btn.onclick = () => selectEquip(equip);
      grid.appendChild(btn);
    });
}

// ── 設備選択 ──────────────────────────────
function selectEquip(equip) {
  currentEquip = equip;
  checks = {};
  partDetails = {};
  itemNotes = {};
  // 交換ステータスの部品エントリもリセット済み（partDetails={}）
  document.getElementById("memo").value = "";
  document.getElementById("error-banner").style.display = "none";
  document.getElementById("submit-btn").textContent = "🚀 点検完了・送信";
  document.getElementById("submit-btn").style.background = "linear-gradient(135deg,#1d4ed8,#7c3aed)";

  // タイトル
  document.getElementById("form-title").innerHTML =
    `📋 ${equip.name} <span class="equip-id-badge">${equip.id}</span>`;

  // 前回メモ
  const last = [...history].reverse().find(h => h.equipId === equip.id);
  const pmBox = document.getElementById("prev-memo-box");
  if (last?.memo) {
    document.getElementById("prev-memo-text").textContent = last.memo;
    pmBox.style.display = "block";
  } else {
    pmBox.style.display = "none";
  }

  // 点検項目
  renderItems();
  document.getElementById("inspection-form").style.display = "block";
  document.getElementById("inspection-form").scrollIntoView({ behavior: "smooth" });
  renderEquipGrid();
}

// ── 点検項目レンダリング ──────────────────
function renderItems() {
  const list = document.getElementById("item-list");
  list.innerHTML = "";
  currentEquip.items.forEach(itemObj => {
    const name = itemObj.name;
    const unit = itemObj.unit || "個";
    const parts = itemObj.parts || [];
    const safeId = name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_");
    const row = document.createElement("div");
    row.className = "item-row";
    row.id = "row-" + safeId;

    // ボタン群
    const btnGroup = Object.entries(STATUS).map(([key, s]) =>
      `<button class="status-btn" id="btn-${safeId}-${key}" onclick="setCheck('${safeId}','${key}')">
        <span class="icon">${s.icon}</span><span>${s.label}</span>
       </button>`
    ).join("");

    row.innerHTML = `
      <div class="item-name" id="name-${safeId}">
        <span class="error-dot" id="dot-${safeId}" style="display:none">●</span>
        ${name}
      </div>
      <div class="btn-group">${btnGroup}</div>
      <div class="item-note">
        <span class="item-note-label">📝 備考・メモ</span>
        <textarea id="note-${safeId}" rows="2" placeholder="気づいた点・数値・状態など..."
          oninput="updateNote('${safeId}', this.value)"></textarea>
        ${itemObj.manual ? `<button class="manual-btn" onclick="openManualModal('${safeId}')">📋 メンテナンス図</button>` : ''}
      </div>
      <div class="replace-form" id="replace-${safeId}">
        <div class="replace-title">🔧 交換部品詳細</div>
        ${parts && parts.length > 0 ? `
        <div class="parts-select-wrap">
          <span class="parts-select-label">📦 登録済み部品から選択して追加</span>
          <select class="parts-select" onchange="selectPresetPart('${safeId}', this.value, this)">
            <option value="">-- 部品を選択 --</option>
            ${parts.map((p,i) => `<option value="${i}">${p.partName}　${p.partNo ? '／ ' + p.partNo : ''}</option>`).join('')}
          </select>
        </div>
        <div class="parts-divider">または手入力</div>
        ` : ''}
        <div id="part-entries-${safeId}"></div>
        <button class="add-part-btn" onclick="addPartEntry('${safeId}','${unit}')">＋ 部品を追加</button>
      </div>`;

    // partDetailsを配列で初期化
    if (!partDetails[safeId]) partDetails[safeId] = { unit, entries: [] };

    list.appendChild(row);
  });
}

function setCheck(item, status) {
  checks[item] = status;
  const s = STATUS[status];
  const row = document.getElementById("row-" + item);
  row.style.background = s.bg;
  row.style.borderColor = s.border;

  // ボタン強調
  Object.keys(STATUS).forEach(k => {
    const btn = document.getElementById(`btn-${item}-${k}`);
    if (k === status) {
      btn.style.background = STATUS[k].bg;
      btn.style.color = STATUS[k].color;
      btn.style.border = `2px solid ${STATUS[k].color}`;
      btn.style.boxShadow = `0 0 8px ${STATUS[k].color}44`;
    } else {
      btn.style.background = "#0f172a";
      btn.style.color = "#64748b";
      btn.style.border = "2px solid #334155";
      btn.style.boxShadow = "none";
    }
  });

  // 交換フォーム
  const rf = document.getElementById("replace-" + item);
  rf.classList.toggle("show", status === "replace");


  // エラー解除
  document.getElementById("dot-" + item).style.display = "none";
  row.classList.remove("error");
}

function setAllOk() {
  currentEquip.items.forEach(itemObj => {
    const safeId = itemObj.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_");
    setCheck(safeId, "ok");
  });
}

// 部品エントリを追加（手入力用の行を追加）
function addPartEntry(safeId, unit, presetName, presetNo) {
  if (!partDetails[safeId]) partDetails[safeId] = { unit, entries: [] };
  const idx = partDetails[safeId].entries.length;
  partDetails[safeId].entries.push({ partName: presetName||"", partNo: presetNo||"", qty: 1 });

  const container = document.getElementById("part-entries-" + safeId);
  const entry = document.createElement("div");
  entry.className = "part-entry";
  entry.id = `entry-${safeId}-${idx}`;
  entry.innerHTML = `
    <div class="part-entry-num">部品 ${idx + 1}</div>
    <button class="part-remove-btn" onclick="removePartEntry('${safeId}',${idx})">✕ 削除</button>
    <div class="replace-grid">
      <div><span class="small-label">部品名</span>
        <input class="small-input" id="pname-${safeId}-${idx}" type="text"
          placeholder="例: オイルフィルター" value="${presetName||''}"
          oninput="updatePartEntry('${safeId}',${idx},'partName',this.value)"></div>
      <div><span class="small-label">型番</span>
        <input class="small-input" id="pno-${safeId}-${idx}" type="text"
          placeholder="例: OF-001" value="${presetNo||''}"
          oninput="updatePartEntry('${safeId}',${idx},'partNo',this.value)"></div>
      <div><span class="small-label">数量　<strong style="color:#60a5fa;font-size:14px">${unit}</strong></span>
        <input class="small-input qty" type="number" placeholder="1" min="1" value="1"
          oninput="updatePartEntry('${safeId}',${idx},'qty',this.value)"></div>
    </div>`;
  container.appendChild(entry);
  // 番号を更新
  refreshEntryNums(safeId);
}

function removePartEntry(safeId, idx) {
  partDetails[safeId].entries[idx] = null;
  const el = document.getElementById(`entry-${safeId}-${idx}`);
  if (el) el.remove();
  refreshEntryNums(safeId);
}

function refreshEntryNums(safeId) {
  const container = document.getElementById("part-entries-" + safeId);
  if (!container) return;
  let num = 1;
  container.querySelectorAll(".part-entry").forEach(el => {
    const numEl = el.querySelector(".part-entry-num");
    if (numEl) numEl.textContent = "部品 " + num++;
  });
}

function updatePartEntry(safeId, idx, field, value) {
  if (!partDetails[safeId] || !partDetails[safeId].entries[idx]) return;
  partDetails[safeId].entries[idx][field] = value;
}

// 登録済み部品を選択 → 行を自動追加
function selectPresetPart(safeId, idx, selectEl) {
  if (idx === "") return;
  const itemObj = currentEquip.items.find(i =>
    i.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_") === safeId
  );
  if (!itemObj || !itemObj.parts) return;
  const p = itemObj.parts[parseInt(idx)];
  if (!p) return;
  const unit = itemObj.unit || "個";
  addPartEntry(safeId, unit, p.partName, p.partNo);
  selectEl.value = "";
}

// 旧updatePart（互換用）
function updatePart(item, field, value) {
  if (!partDetails[item]) partDetails[item] = { unit:"個", entries:[] };
}

// 項目別備考
let itemNotes = {};
function updateNote(safeId, value) {
  itemNotes[safeId] = value;
}



// ── 送信 ──────────────────────────────────
async function handleSubmit() {
  const operator = document.getElementById("operator-select").value;
  if (!operator) { showToast("担当者を選択してください", "error"); return; }

  const unchecked = currentEquip.items.filter(itemObj => {
    const safeId = itemObj.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_");
    return !checks[safeId];
  });
  if (unchecked.length > 0) {
    unchecked.forEach(itemObj => {
      const safeId = itemObj.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_");
      document.getElementById("row-" + safeId).classList.add("error");
      document.getElementById("dot-" + safeId).style.display = "inline";
    });
    const banner = document.getElementById("error-banner");
    banner.textContent = "⚠ 未チェックの項目があります：" + unchecked.map(i=>i.name).join(" / ");
    banner.style.display = "block";
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "⏳ 送信中...";

  // checksのキーをsafeIdから元の項目名に戻す
  const namedChecks = {};
  const namedParts = {};
  const namedNotes = {};
  currentEquip.items.forEach(itemObj => {
    const safeId = itemObj.name.replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g, "_");
    if (checks[safeId]) namedChecks[itemObj.name] = checks[safeId];
    if (partDetails[safeId] && partDetails[safeId].entries && partDetails[safeId].entries.filter(Boolean).length > 0) {
      namedParts[itemObj.name] = {
        unit: partDetails[safeId].unit,
        entries: partDetails[safeId].entries.filter(Boolean),
      };
    }
    if (itemNotes[safeId]) namedNotes[itemObj.name] = itemNotes[safeId];
  });

  const payload = {
    timestamp: new Date().toLocaleString("ja-JP"),
    operator,
    equipId: currentEquip.id,
    equipName: currentEquip.name,
    checks: namedChecks,
    partDetails: namedParts,
    itemNotes: namedNotes,
    memo: document.getElementById("memo").value,
  };

  // GETパラメータ方式（ローカルファイル・GitHub Pages どちらでも動作）
  try {
    const encoded = encodeURIComponent(JSON.stringify(payload));
    const gasUrl = CONFIG.GAS_URL + "?payload=" + encoded;
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = img.onerror = resolve; // GASはJSONを返すのでonerrorになるが送信は成功
      img.src = gasUrl;
      setTimeout(resolve, 8000); // 8秒タイムアウト
    });
    console.log("GAS送信完了（GET）");
  } catch(err) {
    console.error("送信エラー:", err);
    showToast("送信エラー: " + err.message, "error");
    btn.disabled = false;
    btn.textContent = "🚀 点検完了・送信";
    return;
  }

  // 履歴保存
  history = [payload, ...history].slice(0, 5);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();

  btn.textContent = "✅ 送信完了!";
  btn.style.background = "linear-gradient(135deg,#16a34a,#15803d)";
  showToast("送信完了 ✓", "success");

  setTimeout(() => {
    currentEquip = null;
    document.getElementById("inspection-form").style.display = "none";
    btn.disabled = false;
    renderEquipGrid();
  }, 2000);
}

// ── 履歴 ──────────────────────────────────
function renderHistory() {
  const sec = document.getElementById("history-section");
  const list = document.getElementById("history-list");
  if (!history.length) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  list.innerHTML = "";
  history.forEach(h => {
    const card = document.createElement("div");
    card.className = "history-card";
    const badges = Object.entries(h.checks).map(([item, st]) => {
      const s = STATUS[st];
      return `<span class="h-badge" style="color:${s.color};border-color:${s.border};background:${s.bg}">${item}: ${s.label}</span>`;
    }).join("");
    card.innerHTML = `
      <div class="history-top">
        <span class="history-equip">${h.equipName}</span>
        <span class="history-id">${h.equipId}</span>
        <span class="history-op">👤 ${h.operator}</span>
      </div>
      <div class="history-time">🕐 ${h.timestamp}</div>
      <div class="history-statuses">${badges}</div>
      ${h.memo ? `<div class="history-memo">📌 ${h.memo}</div>` : ""}`;
    list.appendChild(card);
  });
}

// ── Toast ──────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.style.background = type === "success" ? "#052e16" : "#2d0a0a";
  t.style.borderColor = type === "success" ? "#22c55e" : "#ef4444";
  t.style.color = type === "success" ? "#22c55e" : "#ef4444";
  setTimeout(() => { t.style.display = "none"; }, 3000);
}
</script>
